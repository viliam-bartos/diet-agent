name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a second push waits instead of racing the first over the same
# container and the same SQLite file.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A GitHub-hosted runner cannot reach this machine's Docker daemon, so the job needs a
    # self-hosted runner installed on the machine that hosts the bot.
    runs-on: self-hosted
    steps:
      - name: Check the clone for local changes
        env:
          # Repository variable; when unset the clone is expected in ~/diet-agent.
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
        run: |
          set -euo pipefail
          target="${PROJECT_DIR:-$HOME/diet-agent}"
          if [ ! -f "$target/docker-compose.yml" ]; then
            echo "V '$target' není docker-compose.yml. Nastav v repozitáři proměnnou PROJECT_DIR." >&2
            exit 1
          fi
          cd "$target"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Klon v '$target' má necommitnuté změny, takže by je pull přepsal:" >&2
            git status --short >&2
            echo >&2
            echo "Nastavení patří do .env, který v gitu není (WEB_BIND, DASHBOARD_URL, TZ," >&2
            echo "PUID, PGID). Po přenesení hodnot změny v klonu zahoď:" >&2
            echo "  cd $target && git checkout -- docker-compose.yml" >&2
            exit 1
          fi

      - name: Pull and rebuild the container
        env:
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
        run: |
          set -euo pipefail
          target="${PROJECT_DIR:-$HOME/diet-agent}"
          cd "$target"
          GIT_TERMINAL_PROMPT=0 git pull --ff-only
          docker compose up -d --build --remove-orphans
          # Untagged leftovers from previous builds, otherwise every deploy leaves an image.
          docker image prune -f || true

      - name: Wait for the dashboard
        env:
          PROJECT_DIR: ${{ vars.PROJECT_DIR }}
        run: |
          set -euo pipefail
          target="${PROJECT_DIR:-$HOME/diet-agent}"
          cd "$target"
          for attempt in $(seq 1 30); do
            # Asked inside the container on purpose: there the server always listens on
            # 127.0.0.1:8000, while on the host the port may be published on one specific
            # address only (a Tailscale address, for instance).
            if docker exec nutrition-agent python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/version', timeout=5)"; then
              echo
              echo "Kontejner odpovídá. Port je publikovaný jako:"
              docker compose port nutrition-agent 8000 || true
              exit 0
            fi
            sleep 2
          done
          echo "Dashboard neodpovídá, poslední logy:" >&2
          docker logs --tail 50 nutrition-agent >&2
          exit 1
