[project]
name = "nutrition-agent"
version = "0.1.0"
description = "Nutriční agent s DIAAS diskontováním bílkovin"
authors = [{ name = "Viliam Bartoš" }]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
]

[project.scripts]
nutrition-agent = "nutrition_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []